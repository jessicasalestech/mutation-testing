name: Mutation Testing — Stryker + Jest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests + Coverage + Mutation Score
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Coverage (100% gate)
        run: npm run test:coverage

      - name: Mutation testing (strong suite — 95% gate)
        run: npm run test:mutation:solution

      - name: Publish mutation report (HTML artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/
          retention-days: 14